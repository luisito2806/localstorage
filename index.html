<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo localStorage</title>
</head>
<body>
    <h1>Lista de tareas</h1>
    <form id="formulario">
        <input
            type="text"
            id="tarea"
            placeholder="Escribe una tarea"
            required
        >
        <button type="submit">
            Agregar
        </button>
    </form>
    <hr>
    <ul id="lista"></ul>
    <button id="borrarTodo">
        Borrar todas
    </button>

    <script>
        const formulario = document.getElementById("formulario");
        const inputTarea = document.getElementById("tarea");
        const lista = document.getElementById("lista");
        const borrarTodo = document.getElementById("borrarTodo");

        // Cargar tareas guardadas o crear arreglo vacío.
        // Si lo guardado está dañado o alterado, se descarta lo que no tenga el formato esperado.
        let tareas = cargarTareas();

        function cargarTareas() {
            try {
                const guardadas = JSON.parse(localStorage.getItem("tareas"));
                if (!Array.isArray(guardadas)) {
                    return [];
                }
                return guardadas.filter(function(tarea) {
                    return tarea &&
                        Number.isFinite(tarea.id) &&
                        typeof tarea.texto === "string" &&
                        typeof tarea.completada === "boolean";
                });
            } catch (error) {
                return [];
            }
        }

        // Mostrar las tareas al cargar la página
        mostrarTareas();

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();

            const texto = inputTarea.value.trim();

            if (texto === "") {
                return;
            }

            const nuevaTarea = {
                id: Date.now(),
                texto: texto,
                completada: false
            };

            tareas.push(nuevaTarea);

            guardarTareas();

            mostrarTareas();

            inputTarea.value = "";
        });

        function guardarTareas() {
            localStorage.setItem(
                "tareas",
                JSON.stringify(tareas)
            );
        }

        // Se arma cada tarea con elementos y textContent, nunca con innerHTML:
        // así el texto que escribe el usuario no puede inyectar HTML ni código.
        function mostrarTareas() {
            lista.replaceChildren();

            tareas.forEach(function(tarea) {
                const li = document.createElement("li");

                const texto = document.createElement("span");
                texto.textContent = (tarea.completada ? "✅ " : "❌ ") + tarea.texto + " ";

                const botonCompletar = document.createElement("button");
                botonCompletar.type = "button";
                botonCompletar.textContent = "Completar";
                botonCompletar.addEventListener("click", function() {
                    completarTarea(tarea.id);
                });

                const botonEliminar = document.createElement("button");
                botonEliminar.type = "button";
                botonEliminar.textContent = "Eliminar";
                botonEliminar.addEventListener("click", function() {
                    eliminarTarea(tarea.id);
                });

                li.append(texto, botonCompletar, " ", botonEliminar);
                lista.appendChild(li);
            });
        }

        function completarTarea(id) {
            const tarea = tareas.find(function(tarea) {
                return tarea.id === id;
            });

            if (tarea) {
                tarea.completada = !tarea.completada;
            }

            guardarTareas();
            mostrarTareas();
        }

        function eliminarTarea(id) {
            tareas = tareas.filter(function(tarea) {
                return tarea.id !== id;
            });

            guardarTareas();
            mostrarTareas();
        }

        borrarTodo.addEventListener("click", function() {
            tareas = [];
            guardarTareas();
            mostrarTareas();
        });
    </script>
</body>
</html>
