<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo localStorage</title>
</head>
<body>
    <h1>Lista de tareas</h1>
    <form id="formulario">
        <input
            type="text"
            id="tarea"
            placeholder="Escribe una tarea"
            required
        >
        <button type="submit">
            Agregar
        </button>
    </form>
    <hr>
    <ul id="lista"></ul>
    <button id="borrarTodo">
        Borrar todas
    </button>

    <script>
        const formulario = document.getElementById("formulario");
        const inputTarea = document.getElementById("tarea");
        const lista = document.getElementById("lista");
        const borrarTodo = document.getElementById("borrarTodo");

        // Cargar tareas guardadas o crear arreglo vacío
        let tareas = JSON.parse(localStorage.getItem("tareas")) || [];

        // Mostrar las tareas al cargar la página
        mostrarTareas();

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();

            const texto = inputTarea.value.trim();

            if (texto === "") {
                return;
            }

            const nuevaTarea = {
                id: Date.now(),
                texto: texto,
                completada: false
            };

            tareas.push(nuevaTarea);

            guardarTareas();

            mostrarTareas();

            inputTarea.value = "";
        });

        function guardarTareas() {
            localStorage.setItem(
                "tareas",
                JSON.stringify(tareas)
            );
        }

        function mostrarTareas() {
            lista.innerHTML = "";

            tareas.forEach(function(tarea) {
                const li = document.createElement("li");

                li.innerHTML = `
                    <span>
                        ${tarea.completada ? "✅" : "❌"}
                        ${tarea.texto}
                    </span>
                `;

                li.innerHTML += `
                    <button onclick="completarTarea(${tarea.id})">
                        Completar
                    </button>
                    <button onclick="eliminarTarea(${tarea.id})">
                        Eliminar
                    </button>
                `;

                lista.appendChild(li);
            });
        }

        function completarTarea(id) {
            const tarea = tareas.find(function(tarea) {
                return tarea.id === id;
            });

            if (tarea) {
                tarea.completada = !tarea.completada;
            }

            guardarTareas();
            mostrarTareas();
        }

        function eliminarTarea(id) {
            tareas = tareas.filter(function(tarea) {
                return tarea.id !== id;
            });

            guardarTareas();
            mostrarTareas();
        }

        borrarTodo.addEventListener("click", function() {
            tareas = [];
            guardarTareas();
            mostrarTareas();
        });
    </script>
</body>
</html>
